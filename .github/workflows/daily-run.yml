name: Daily Content Agent

on:
  schedule:
    - cron: '30 1 * * *'   # 7:00 AM IST (UTC+5:30) daily
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write        # needed to push data back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create .env file from secrets
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TRANSCRIBE_KEY: ${{ secrets.GEMINI_TRANSCRIBE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo "APIFY_TOKEN=${APIFY_TOKEN}" > .env
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> .env
          echo "GEMINI_TRANSCRIBE_KEY=${GEMINI_TRANSCRIBE_KEY}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}" >> .env
          echo "TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}" >> .env
          echo "YOUTUBE_API_KEY=${YOUTUBE_API_KEY}" >> .env

      - name: Configure git for data pushback
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "Content Agent Bot"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/garvitb7856/content-agent.git

      - name: Run full pipeline
        run: node scripts/run_all.js

      - name: Push any remaining changes
        if: always()
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "ci: cleanup push [skip ci]"
          git push origin main || true
