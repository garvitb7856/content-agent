<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Content Agent Dashboard — @garvit.irl</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07090f;color:#f1f5f9;font-family:'Inter',sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:rgba(7,9,15,.96);border-bottom:1px solid rgba(255,255,255,.07);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:.5rem}
.logo{font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,#fff 30%,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-r{display:flex;align-items:center;gap:.6rem;font-size:.75rem;flex-wrap:wrap}
.badge{padding:.25rem .65rem;border-radius:20px;font-weight:700;font-size:.68rem;letter-spacing:.05em;background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.25)}
.hdr-ts{color:#475569}.hdr-h{color:#a78bfa;font-weight:700}
main{max-width:1300px;margin:2rem auto;padding:0 1.25rem;display:flex;flex-direction:column;gap:2rem}
.sec{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#475569;margin-bottom:.75rem}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:.875rem}
.sc{background:rgba(15,21,36,.9);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:1.1rem 1rem;transition:transform .2s}
.sc:hover{transform:translateY(-2px)}
.sl{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:#475569;margin-bottom:.3rem}
.sv{font-size:1.45rem;font-weight:800}
.ss{font-size:.67rem;color:#64748b;margin-top:.15rem}
/* Agents */
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(295px,1fr));gap:1rem}
.ac{background:rgba(15,21,36,.9);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:1.1rem;display:flex;flex-direction:column;gap:.7rem;border-left:3px solid}
.ah{display:flex;align-items:flex-start;gap:.65rem}
.ai{width:2.1rem;height:2.1rem;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.an{font-size:.86rem;font-weight:700;color:#f1f5f9}
.ar{font-size:.67rem;color:#64748b;margin-top:.1rem}
.ab{font-size:.58rem;font-weight:700;padding:.16rem .42rem;border-radius:5px;flex-shrink:0;margin-top:.15rem}
.ab-l{background:rgba(16,185,129,.12);color:#10b981;border:1px solid rgba(16,185,129,.2)}
.ab-i{background:rgba(100,116,139,.08);color:#64748b;border:1px solid rgba(100,116,139,.12)}
.ao{background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.04);border-radius:8px;padding:.72rem;font-size:.76rem;color:#94a3b8;line-height:1.65;height:95px;overflow:hidden;position:relative;white-space:pre-wrap;word-break:break-word}
.ao::after{content:'';position:absolute;bottom:0;left:0;right:0;height:36px;background:linear-gradient(transparent,rgba(7,9,15,.95))}
.vb{display:block;width:100%;padding:.48rem;background:linear-gradient(90deg,#7c3aed,#db2777);color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:.78rem;font-weight:700;letter-spacing:.02em;transition:opacity .15s}
.vb:hover{opacity:.82}
.ats{font-size:.63rem;color:#334155}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.6rem}
.cd{background:rgba(15,21,36,.9);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:.72rem .35rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.22rem}
.cd.now{border-color:#6366f1;background:rgba(99,102,241,.08)}
.cdl{font-size:.58rem;font-weight:700;text-transform:uppercase;color:#475569;letter-spacing:.06em}
.cdn{font-size:.95rem;font-weight:800;color:#f1f5f9}
.ctag{font-size:.58rem;font-weight:700;padding:.13rem .32rem;border-radius:4px}
.ct-r{background:rgba(168,85,247,.15);color:#a855f7}
.ct-c{background:rgba(56,189,248,.15);color:#38bdf8}
.ct-x{color:#334155;font-size:.58rem}
/* Table */
.tw{background:rgba(15,21,36,.9);border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.81rem}
thead{background:rgba(0,0,0,.4)}
th{padding:.65rem .9rem;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#475569;border-bottom:1px solid rgba(255,255,255,.05);text-align:left;white-space:nowrap}
td{padding:.65rem .9rem;border-bottom:1px solid rgba(255,255,255,.025);color:#94a3b8}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
.you td{color:#f1f5f9;font-weight:700}
.bw{display:flex;align-items:center;gap:.4rem}
.bb{flex:1;height:4px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;min-width:28px}
.bf{height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:2px}
/* Modal */
#mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;overflow-y:auto;padding:1.5rem 1rem}
#mo.show{display:block}
#mb{background:#0c0f1e;border:1.5px solid rgba(124,58,237,.45);border-radius:14px;padding:2rem 2rem 2.5rem;width:100%;max-width:760px;margin:0 auto;position:relative}
#mt{font-size:1rem;font-weight:800;color:#a78bfa;margin-bottom:1.25rem;padding-right:2.5rem}
/* Modal content rich styles */
#mc{font-size:.84rem;line-height:1.9;color:#cbd5e1}
#mc strong,#mc b{color:#f1f5f9;font-weight:700}
#mc em,#mc i{color:#a78bfa;font-style:italic}
#mc h1{font-size:1rem;color:#a78bfa;font-weight:800;margin:1.4rem 0 .5rem;padding-bottom:.3rem;border-bottom:1px solid rgba(124,58,237,.2)}
#mc h2{font-size:.94rem;color:#a78bfa;font-weight:700;margin:1.2rem 0 .4rem}
#mc h3{font-size:.88rem;color:#c4b5fd;font-weight:700;margin:1rem 0 .35rem}
#mc h4{font-size:.82rem;color:#94a3b8;font-weight:600;margin:.85rem 0 .3rem;text-transform:uppercase;letter-spacing:.05em}
#mc p{margin:.35rem 0}
#mc ul{margin:.4rem 0 .4rem 1.3rem;list-style:disc}
#mc ol{margin:.4rem 0 .4rem 1.3rem;list-style:decimal}
#mc li{margin:.2rem 0;color:#cbd5e1}
#mc hr{border:none;border-top:1px solid rgba(255,255,255,.06);margin:.9rem 0}
#mc blockquote{border-left:3px solid #7c3aed;padding:.5rem .75rem;background:rgba(124,58,237,.07);border-radius:0 6px 6px 0;margin:.5rem 0;color:#c4b5fd;font-style:italic}
#mc code{background:rgba(99,102,241,.12);color:#c4b5fd;padding:.1rem .3rem;border-radius:3px;font-size:.78rem;font-family:monospace}
#mc pre{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:.85rem;overflow-x:auto;margin:.5rem 0}
#mc pre code{background:none;padding:0}
/* Inline links in modal */
#mc a{color:#818cf8;text-decoration:none;border-bottom:1px solid rgba(129,140,248,.3);transition:color .15s,border-color .15s}
#mc a:hover{color:#a78bfa;border-bottom-color:rgba(167,139,250,.5)}
/* Day block in planner */
#mc .day-block{background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.15);border-radius:8px;padding:1rem;margin:.75rem 0}
/* Table in modal */
#mc table{width:100%;border-collapse:collapse;font-size:.78rem;margin:.75rem 0;border-radius:6px;overflow:hidden}
#mc thead th{background:rgba(99,102,241,.15);color:#a78bfa;padding:.4rem .65rem;border:1px solid rgba(255,255,255,.06);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
#mc tbody td{padding:.4rem .65rem;border:1px solid rgba(255,255,255,.04);color:#94a3b8}
#mc tbody tr:hover td{background:rgba(255,255,255,.02)}
.mclose{position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.06);color:#94a3b8;border:none;border-radius:6px;width:1.9rem;height:1.9rem;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:background .15s}
.mclose:hover{background:rgba(255,255,255,.12);color:#fff}
footer{text-align:center;padding:2rem 1rem 3rem;color:#1e293b;font-size:.72rem;border-top:1px solid rgba(255,255,255,.03)}
</style>
</head>
<body>
<header>
  <div class="logo">⚡ Content Agent OS</div>
  <div class="hdr-r">
    <span class="badge">LIVE</span>
    <span class="hdr-ts" id="hts">Loading...</span>
    <span class="hdr-h">@garvit.irl</span>
  </div>
</header>
<main>
  <div><div class="sec">Your Stats</div><div class="stats" id="stats"></div></div>
  <div><div class="sec">AI Agent Squad</div><div class="agents" id="agents"></div></div>
  <div><div class="sec">7-Day Content Planner</div><div class="cal" id="cal"></div></div>
  <div><div class="sec">Competitor Benchmark</div><div class="tw" id="tbl"></div></div>
</main>
<footer>Content Agent Dashboard · @garvit.irl · Powered by Apify + Gemini AI</footer>
<div id="mo">
  <div id="mb">
    <button class="mclose" id="mcloseBtn" title="Close">✕</button>
    <div id="mt"></div>
    <div id="mc"></div>
  </div>
</div>
<script>
(function(){
var AGENTS=[
  {key:"ideator",    icon:"💡",color:"#f59e0b",name:"Ideator Agent",      role:"Viral topics & competitor hooks"},
  {key:"hook_script",icon:"🎣",color:"#ec4899",name:"Hook & Script Agent",role:"Full Reel scripts & captions"},
  {key:"planner",    icon:"📅",color:"#06b6d4",name:"Planner Agent",       role:"7-day calendar & posting times"},
  {key:"analyst",    icon:"📊",color:"#10b981",name:"Analyst Agent",       role:"Competitor benchmarks & growth gaps"},
  {key:"dm_manager", icon:"💬",color:"#7c3aed",name:"DM Manager Agent",    role:"Lead magnets & DM templates"}
];
var D=null,AI=null,FULL={};

/* ── Modal ── */
var mo=document.getElementById("mo");
document.getElementById("mcloseBtn").onclick=closeM;
mo.addEventListener("click",function(e){if(e.target===mo)closeM();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM();});
function openM(key){
  var a=AGENTS.filter(function(x){return x.key===key;})[0];
  if(!a)return;
  document.getElementById("mt").textContent=a.name+" — Full Output";
  document.getElementById("mc").innerHTML=FULL[key]||"<em style='color:#475569'>No output yet. Run run_agents.py on your PC.</em>";
  mo.classList.add("show");
  mo.scrollTop=0;
}
function closeM(){mo.classList.remove("show");}
window.openM=openM;

/* ── Helpers ── */
function fmt(n){n=parseInt(n,10);if(isNaN(n))return"–";return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":""+n;}
function av(a){if(!a||!a.length)return 0;return Math.round(a.reduce(function(s,v){return s+(v||0);},0)/a.length);}
function esc(s){return(""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ── Markdown → HTML with clickable links ── */
function md(s){
  if(!s)return"";
  // Normalize line endings (Windows CRLF → LF)
  var o=s.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  // Extract markdown links before escaping
  var links=[];
  o=o.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,function(_,txt,url){
    var i=links.length;
    var isInsta=url.indexOf("instagram.com")>-1;
    links.push('<a href="'+url+'" target="_blank" rel="noopener">'+(isInsta?"📸 ":"")+esc(txt)+"</a>");
    return"\x00LINK"+i+"\x00";
  });
  o=o.replace(/(https?:\/\/www\.instagram\.com\/p\/[A-Za-z0-9_-]+\/?)/g,function(_,url){
    var i=links.length;
    links.push('<a href="'+url+'" target="_blank" rel="noopener">📸 View on Instagram</a>');
    return"\x00LINK"+i+"\x00";
  });
  // Escape HTML
  o=esc(o);
  // Headings
  o=o
    .replace(/^####\s+(.+)$/gm,"<h4>$1</h4>")
    .replace(/^###\s+(.+)$/gm,"<h3>$1</h3>")
    .replace(/^##\s+DAY\s+(\d+)\s+[—–-]+\s*(.+)$/gm,'<div class="day-block"><h2>📅 Day $1 — $2</h2>')
    .replace(/^##\s+(.+)$/gm,"<h2>$1</h2>")
    .replace(/^#\s+(.+)$/gm,"<h1>$1</h1>");
  // Close day-block divs before next day-block or end
  o=o.replace(/(<div class="day-block">)([\s\S]*?)(?=<div class="day-block">|$)/g,function(_,open,content){
    return open+content+"</div>";
  });
  // Bold/italic/code
  o=o
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\*([^*\n]+?)\*/g,"<em>$1</em>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/^&gt;\s+(.+)$/gm,"<blockquote>$1</blockquote>")
    .replace(/^---+$/gm,"<hr>");
  // Tables — handle separator rows properly
  var lines=o.split("\n");
  var out=[],inTable=false,thead=true,tableRows=[];
  for(var li=0;li<lines.length;li++){
    var ln=lines[li];
    // Check if this line is a table row
    if(/^\|.+\|$/.test(ln.trim())){
      // Check if it's a separator row (only contains -, :, |, spaces)
      if(/^\|[\s|:\-]+\|$/.test(ln.trim())){
        // This is alignment row — skip it, mark that next rows are tbody
        thead=false;
        if(!inTable){inTable=true;tableRows=[];}
        continue;
      }
      if(!inTable){inTable=true;thead=true;tableRows=[];}
      var cells=ln.trim().replace(/^\||\|$/g,"").split("|").map(function(c){return c.trim();});
      if(thead){
        tableRows.push("<thead><tr>"+cells.map(function(c){return"<th>"+c+"</th>";}).join("")+"</tr></thead><tbody>");
        thead=false;
      } else {
        tableRows.push("<tr>"+cells.map(function(c){return"<td>"+c+"</td>";}).join("")+"</tr>");
      }
    } else {
      if(inTable){
        out.push("<table>"+tableRows.join("")+"</tbody></table>");
        inTable=false;thead=true;tableRows=[];
      }
      out.push(ln);
    }
  }
  if(inTable){out.push("<table>"+tableRows.join("")+"</tbody></table>");}
  o=out.join("\n");
  // Lists
  o=o.replace(/^\s*[-*]\s+(.+)$/gm,"<li>$1</li>");
  o=o.replace(/^\d+\.\s+(.+)$/gm,"<li data-ol>$1</li>");
  o=o.replace(/(<li(?! data-ol)[^>]*>[\s\S]+?<\/li>\n?)+/g,"<ul>$&</ul>");
  o=o.replace(/(<li data-ol[\s\S]+?<\/li>\n?)+/g,"<ol>$&</ol>");
  o=o.replace(/ data-ol/g,"");
  // Paragraphs
  o=o.replace(/\n\n/g,"</p><p>").replace(/\n/g,"<br>");
  o="<p>"+o+"</p>";
  // Clean up double-wrapped blocks
  ["h1","h2","h3","h4","ul","ol","table","hr","blockquote"].forEach(function(t){
    o=o.replace(new RegExp("<p>(<"+t+">)","g"),"$1").replace(new RegExp("(</"+t+">)<\\/p>","g"),"$1");
  });
  o=o.replace(/<p>(<hr>)<\/p>/g,"$1");
  o=o.replace(/<p>(<div)/g,"$1").replace(/(<\/div>)<\/p>/g,"$1");
  o=o.replace(/<p><\/p>/g,"").replace(/<p>\s*<br>\s*<\/p>/g,"");
  // Restore links
  o=o.replace(/\x00LINK(\d+)\x00/g,function(_,i){return links[parseInt(i)];});
  return o;
}

/* ── Render Stats ── */
function renderStats(){
  var acc=(D&&D.your_account)||{};
  var posts=Array.isArray(acc.posts)?acc.posts:[];
  var comps=(D&&D.competitors)||{};
  var cp=[];Object.keys(comps).forEach(function(k){var p=comps[k].posts;if(Array.isArray(p))cp=cp.concat(p);});
  var aiTs=(AI&&AI._ts)?new Date(AI._ts).toLocaleTimeString("en-IN"):null;
  var topL=posts.length?Math.max.apply(null,posts.map(function(p){return p.likes||0;})):0;
  var myAL=av(posts.map(function(p){return p.likes||0;}));
  var cpAL=av(cp.map(function(p){return p.likes||0;}));
  var items=[
    {l:"Your Followers",v:fmt(acc.followers||5845),s:"@garvit.irl",c:"#a78bfa"},
    {l:"Your Avg Likes", v:fmt(myAL||0),s:"Comp avg: "+fmt(cpAL),c:"#10b981"},
    {l:"Posts Analysed", v:posts.length||"–",s:"last 20",c:"#38bdf8"},
    {l:"Competitors",    v:Object.keys(comps).length||"–",s:"tracked",c:"#f59e0b"},
    {l:"Best Post",      v:topL?fmt(topL):"–",s:"likes",c:"#ec4899"},
    {l:"AI Agents",      v:aiTs?"LIVE":"SAMPLE",s:aiTs?"Updated "+aiTs:"Run run_agents.py",c:aiTs?"#10b981":"#64748b"}
  ];
  document.getElementById("stats").innerHTML=items.map(function(i){
    return'<div class="sc"><div class="sl">'+i.l+'</div><div class="sv" style="color:'+i.c+'">'+i.v+'</div><div class="ss">'+i.s+'</div></div>';
  }).join("");
}

/* ── Render Agents ── */
function renderAgents(){
  var aiTs=(AI&&AI._ts)?new Date(AI._ts).toLocaleTimeString("en-IN"):null;
  document.getElementById("agents").innerHTML=AGENTS.map(function(a){
    var raw=AI?AI[a.key]||null:null;
    var has=!!raw;
    FULL[a.key]=has?md(raw):"<em style='color:#475569'>No output yet. Run run_agents.py on your PC first.</em>";
    // Plain text preview (strip markdown)
    var preview=raw?raw.replace(/[#*`_>\[\]]/g,"").replace(/\n+/g," ").substring(0,220)+"…":"No output yet — run run_agents.py";
    return'<div class="ac" style="border-left-color:'+a.color+'">'
      +'<div class="ah"><div class="ai" style="background:'+a.color+'18;color:'+a.color+'">'+a.icon+'</div>'
      +'<div style="flex:1;min-width:0"><div class="an">'+a.name+'</div><div class="ar">'+a.role+'</div></div>'
      +'<span class="ab '+(has?"ab-l":"ab-i")+'">'+(has?"⚡ LIVE":"IDLE")+'</span></div>'
      +'<div class="ao">'+esc(preview)+'</div>'
      +'<button class="vb" onclick="openM(\''+a.key+'\')">📄 View Full Output →</button>'
      +'<div class="ats">'+(aiTs?"Last run: "+aiTs:"No AI data yet")+'</div>'
      +'</div>';
  }).join("");
}

/* ── Render Calendar ── */
function renderCal(){
  var dayLabels=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var today=new Date();
  var html="";

  // Parse planner output to extract day data
  var plannerDays=[];
  if(AI && AI.planner){
    var text=AI.planner;
    // Match each DAY block: ## DAY N — DayName Date
    var dayBlocks=text.split(/(?=##\s*DAY\s+\d+)/i);
    dayBlocks.forEach(function(block){
      if(!block.match(/##\s*DAY\s+\d+/i))return;
      var obj={};
      // Format line
      var fmtMatch=block.match(/\*\*Format:\*\*\s*([^\n]+)/i);
      if(fmtMatch) obj.format=fmtMatch[1].trim();
      // Topic line
      var topicMatch=block.match(/\*\*Topic:\*\*\s*([^\n]+)/i);
      if(topicMatch) obj.topic=topicMatch[1].trim();
      // Post time
      var timeMatch=block.match(/\*\*Post Time:\*\*\s*([^\n—–-]+)/i);
      if(timeMatch) obj.time=timeMatch[1].trim().replace(/\s*IST/,'')+'IST';
      // Trigger word
      var trigMatch=block.match(/\*\*Trigger Word:\*\*\s*["\u201c]?([A-Z]+)["\u201d]?/i);
      if(trigMatch) obj.trigger=trigMatch[1].trim();
      plannerDays.push(obj);
    });
  }

  for(var i=0;i<7;i++){
    var d=new Date(today);
    d.setDate(today.getDate()+i);
    var isT=i===0;
    var dayLabel=dayLabels[d.getDay()];
    var dateNum=d.getDate();
    var pd=plannerDays[i]||null;
    var fmt=pd?pd.format:"Reel";
    var topic=pd?pd.topic:"";
    var time=pd?pd.time:"";
    var trigger=pd?pd.trigger:"";

    // Determine format tags to show
    var isCarousel=fmt&&fmt.toLowerCase().indexOf("carousel")>-1;
    var isReel=fmt&&fmt.toLowerCase().indexOf("reel")>-1;
    var isStory=fmt&&fmt.toLowerCase().indexOf("story")>-1;

    var formatTags="";
    if(isCarousel){
      // Show BOTH options — Reel or Carousel
      formatTags='<div class="ctag ct-r" title="Option A">Reel</div>'
                +'<div style="font-size:.52rem;color:#334155;margin:1px 0">or</div>'
                +'<div class="ctag ct-c" title="Option B">Carousel</div>';
    } else if(isReel){
      formatTags='<div class="ctag ct-r">Reel</div>';
    } else if(isStory){
      formatTags='<div class="ctag" style="background:rgba(245,158,11,.15);color:#f59e0b">Story</div>';
    } else {
      formatTags='<div class="ctag ct-r">Reel</div>';
    }

    html+='<div class="cd'+(isT?" now":"")+'">'
      +'<div class="cdl">'+dayLabel+'</div>'
      +'<div class="cdn">'+dateNum+'</div>'
      +formatTags
      +(time?'<div style="font-size:.55rem;color:#6366f1;margin-top:2px">'+esc(time.split("—")[0].trim())+'</div>':"")
      +(trigger?'<div style="font-size:.52rem;color:#475569;margin-top:1px">💬 '+esc(trigger)+'</div>':"")
      +(topic?'<div style="font-size:.55rem;color:#94a3b8;margin-top:3px;line-height:1.3;text-align:center;padding:0 2px">'+esc(topic.substring(0,40))+'</div>':"")
      +'</div>';
  }
  document.getElementById("cal").innerHTML=html;
}

/* ── Render Table ── */
function renderTable(){
  var acc=(D&&D.your_account)||{};
  var comps=(D&&D.competitors)||{};
  var myP=Array.isArray(acc.posts)?acc.posts:[];
  var myAv=av(myP.map(function(p){return p.likes||0;}));
  var rows=[{h:"garvit.irl",f:acc.followers||5845,a:myAv,p:myP.length,you:true}];
  Object.keys(comps).forEach(function(k){
    var c=comps[k],cp=Array.isArray(c.posts)?c.posts:[];
    rows.push({h:k,f:c.followers||0,a:Math.round((c.stats&&c.stats.avg_likes)||av(cp.map(function(p){return p.likes||0;}))),p:cp.length,you:false});
  });
  rows.sort(function(a,b){return b.a-a.a;});
  var mx=Math.max.apply(null,rows.map(function(r){return r.a;}).concat([1]));
  var html='<table><thead><tr><th>Account</th><th>Followers</th><th>Avg Likes</th><th>Posts</th></tr></thead><tbody>';
  rows.forEach(function(r){
    html+='<tr'+(r.you?' class="you"':'')+'><td>@'+esc(r.h)+(r.you?' ★':'')+'</td><td>'+fmt(r.f)+'</td>'
      +'<td><div class="bw">'+fmt(r.a)+'<div class="bb"><div class="bf" style="width:'+Math.round(r.a/mx*100)+'%"></div></div></div></td>'
      +'<td>'+r.p+'</td></tr>';
  });
  document.getElementById("tbl").innerHTML=html+'</tbody></table>';
}

/* ── Header ── */
function renderHdr(){
  var ts=(D&&D.fetched_at)?new Date(D.fetched_at).toLocaleString("en-IN"):new Date().toLocaleString("en-IN");
  document.getElementById("hts").textContent=ts+((D&&D.sample_data===false)?" · LIVE":" · SAMPLE");
}

function renderAll(){
  try{renderStats();}catch(e){console.error(e);}
  try{renderAgents();}catch(e){console.error(e);}
  try{renderCal();}catch(e){console.error(e);}
  try{renderTable();}catch(e){console.error(e);}
  try{renderHdr();}catch(e){console.error(e);}
}

/* ── Load ── */
function load(){
  var p1=fetch("data/data.json").then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
  var p2=fetch("data/agents_output.json").then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
  Promise.all([p1,p2]).then(function(res){
    D=res[0];
    var raw=res[1];
    if(raw){AI=raw;AI._ts=raw.generated_at||raw._generated_at||raw.timestamp||null;}
    else AI=null;
    renderAll();
  }).catch(function(err){console.error("load:",err);renderAll();});
}

load();
setInterval(load,60000);
})();
</script>
